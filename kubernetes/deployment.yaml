
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corporate-data-deployment
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: corporate-data-app

  template:
    metadata:
      labels:
        app: corporate-data-app
      annotations:
        app-version: "2.2.0"

    spec:
      containers:
        - name: corporate-data-app
          image: ghcr.io/smgkgfds-cyber/dashboard:2.2.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: corporate-data-config

          env:
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "corporate"
            - name: DB_USER
              value: "corporate_user"
            - name: DB_PASSWORD
              value: "corporate_password"
