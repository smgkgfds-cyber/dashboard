services:
  db:
    ports:
      - '5432:5432'
    image: postgres:18
    environment:
      POSTGRES_DB: corporate
      POSTGRES_USER: corporate_user
      POSTGRES_PASSWORD: corporate_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U corporate_user -d corporate']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./app
    ports:
      - '8000:8000'
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: corporate
      DB_USER: corporate_user
      DB_PASSWORD: corporate_password
    depends_on:
      db:
        condition: service_healthy

  airflow:
    image: apache/airflow:3.1.0
    container_name: corporate-airflow
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: '/opt/airflow/dags'
      AIRFLOW__CORE__EXECUTOR: 'LocalExecutor'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: 'postgresql+psycopg2://corporate_user:corporate_password@db:5432/airflow_meta'

      DB_HOST: 'db'
      DB_PORT: '5432'
      DB_NAME: 'corporate'
      DB_USER: 'corporate_user'
      DB_PASSWORD: 'corporate_password'

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/output:/opt/airflow/output

    ports:
      - '8081:8080'

    command: >
      bash -c "
      pip install --no-cache-dir psycopg2-binary 'psycopg[binary]' &&
      airflow standalone
      "

volumes:
  postgres_data:
